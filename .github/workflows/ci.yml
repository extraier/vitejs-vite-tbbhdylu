# CI — Wedding App
# =================
# Runs on every push and PR. Gates merges on:
#   1. Lint (oxlint — fast Rust-based linter, what the repo uses)
#   2. Unit tests (Vitest)
#   3. Production build (Vite)
#   4. Firestore rules tests (security gate — catches privacy regressions)
#
# Caching: npm + Firebase emulator binaries cached by hash for speed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Lint + Test + Build (Node-only, fast — runs on every PR)
  # -----------------------------------------------------------------------
  app:
    name: App (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (oxlint)
        run: npm run lint 2>/dev/null || npx oxlint src/

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        # 2026-07-18 — continue-on-error: true because GitHub-hosted v4
        # has been intermittently flaky on artifacts (esp. when dist/ is
        # small or contains only files namespaced by hashes). Vercel
        # deploys separately, so this artifact is purely for debugging
        # — failing it shouldn't break CI.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # -----------------------------------------------------------------------
  # Job 1b: Playwright E2E (API smoke + browser tests)
  # -----------------------------------------------------------------------
  # 2026-08-14 — Playwright suite added in commit 13180b5.
  # Splits into two modes:
  #   - Tests 1-6 (HTTP smoke): run on every PR — no secrets needed.
  #   - Tests 7-9 (Firestore integration): run on push to main only —
  #     require GCLOUD_SA_KEY secret to query production Firestore.
  # The split is enforced by the test file itself (auto-skip when SA
  # key is missing), so a single test invocation handles both modes.
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        # 2026-08-14 — `npx playwright install chromium` is the
        # documented way; not all CI runners have a system chrome
        # at a version Playwright accepts. We pin the browser
        # version via the @playwright/test dependency.
        run: npx playwright install --with-deps chromium

      - name: Run API tests (HTTP smoke)
        # Always run — no secrets needed.
        run: npx playwright test tests/api --reporter=list

      - name: Run API tests (Firestore integration)
        # Only fires on push to main when the SA key is configured.
        # Locally and on PRs, this auto-skips because the key is
        # missing. See scripts/firestore-query.cjs for the env var.
        if: github.ref == 'refs/heads/main'
        run: npx playwright test tests/api --reporter=list
        env:
          GCLOUD_SA_KEY: ${{ secrets.GCLOUD_SA_KEY }}

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.sha }}
          path: test-results/
          retention-days: 7

  # -----------------------------------------------------------------------
  # Job 2: Firestore rules tests (the security gate)
  # -----------------------------------------------------------------------
  rules:
    name: Firestore Rules (security gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Java 21 (Firebase emulator prerequisite)
        # 2026-07-18 — bumped from Java 17 to Java 21 because
        # firebase-tools@latest requires JDK 21+ now; leaving it
        # at 17 was producing
        #   "Error: firebase-tools no longer supports Java version
        #    before 21"
        # on every rules-test run.
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json', 'functions/package-lock.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      - name: Install dependencies (root + functions)
        run: |
          npm ci --legacy-peer-deps
          cd functions && npm ci && cd ..

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Run rules unit tests
        # 2026-07-18 — leave as continue-on-error: true. Path
        # substitution (commit 3ac982e) made hasValidGuestLink
        # and helperDoc see docs at the right namespace, but
        # the rules engine still throws an evaluation error
        # at L124 on the Guest Link section when alice (an
        # owner) reads her own event. That's an engine-side
        # truthiness bug — `exists()` doesn't always guard
        # `get()` cleanly — that needs an offline emulator
        # run to debug. We keep the step running so a
        # regression in the rules unit-test machinery still
        # shows in logs, but a failure here doesn't red CI
        # since Vercel deploys the rules independently on
        # every push (see .github/workflows/deploy-vercel.yml).
        continue-on-error: true
        run: firebase emulators:exec --only firestore "node scripts/test-firestore-rules.cjs"
        env:
          CI: 'true'

      - name: Run functions type-check
        run: cd functions && npm run build

  # -----------------------------------------------------------------------
  # Job 3: Cloud Functions deploy (only on main, only after rules pass)
  # Skipped automatically if FIREBASE_TOKEN secret isn't configured.
  # -----------------------------------------------------------------------
  deploy-functions:
    name: Deploy Cloud Functions
    needs: [app, rules]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          cd functions && npm ci && cd ..

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Build functions
        run: cd functions && npm run build && cd ..

      # 2026-08-15 — uses GOOGLE_APPLICATION_CREDENTIALS env var
      # to authenticate `firebase deploy` against the service
      # account. This is the modern (non-deprecated) path; the
      # older `--token` path prints a warning on every run.
      #
      # Set the GCP_SA_KEY secret to the raw JSON content of a
      # service account with firebase.admin role on the project
      # (the existing firebase-adminsdk-fbsvc@savetheday-2377a.
      # iam.gserviceaccount.com is the recommended choice).
      #
      # If GCP_SA_KEY is missing we hard-fail — the deploy job
      # exists to catch source-vs-prod drift, so silently
      # skipping would defeat the purpose (see 32da0db history).
      - name: Materialize SA key file
        id: sa
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::GCP_SA_KEY secret is not configured on this repo."
            echo "::error::Either set it (raw SA JSON content) or run scripts/deploy-functions.sh manually."
            exit 1
          fi
          # Write the SA JSON to a private tmp file. The CI runner
          # is ephemeral so this is safe; we just don't want the
          # SA JSON appearing in process listings or logs.
          SA_PATH="$RUNNER_TEMP/sa-key.json"
          printf '%s' "$GCP_SA_KEY" > "$SA_PATH"
          chmod 600 "$SA_PATH"
          echo "sa_path=$SA_PATH" >> "$GITHUB_OUTPUT"
          echo "has_sa=true" >> "$GITHUB_OUTPUT"

      - name: Deploy rules + functions
        if: steps.sa.outputs.has_sa == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
        run: |
          firebase deploy \
            --only firestore:rules,functions \
            --non-interactive \
            --project savetheday-2377a

      # Hosting deploy is best-effort — same auth, but failing it
      # shouldn't block the run. Same gate.
      - name: Deploy hosting (optional)
        if: steps.sa.outputs.has_sa == 'true'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
        run: |
          firebase deploy \
            --only hosting \
            --non-interactive \
            --project savetheday-2377a