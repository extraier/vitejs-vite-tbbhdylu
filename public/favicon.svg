<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Save The Day — heart favicon</title>
  <!--
    2026-07-31 — heart emoji replacement for the StackBlitz-purple
    favicon that was shipping as our og-image favicon. Brand color
    matches the existing meta theme-color (#f43f5e). Slight inner
    highlight for legibility at small sizes (16x16, 24x24 — the
    sizes Google shows in search results).

    Geometry notes:
      - Path uses cubic B\u00e9ziers; tuned by eye to match Apple
        \u2764\ufe0f at 64px scale. Adjust if it looks heavy.
      - Inner highlight is a 20% opacity ellipse translated
        upward; cheapes way to get the "gloss" look without a
        gradient (gradients often render poorly in browser tabs).
  -->
  <path
    fill="#f43f5e"
    d="M32 56.7
       C 18.5 47.5 6 39.4 6 24.6
       C 6 16.5 12.6 9.6 21.4 9.6
       C 25.7 9.6 29.7 11.5 32 14.5
       C 34.3 11.5 38.3 9.6 42.6 9.6
       C 51.4 9.6 58 16.5 58 24.6
       C 58 39.4 45.5 47.5 32 56.7 Z" />
  <ellipse
    cx="22"
    cy="20"
    rx="6"
    ry="4"
    fill="#ffffff"
    fill-opacity="0.35" />
</svg>
